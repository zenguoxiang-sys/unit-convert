name: Build Android APK

# 手动触发：Actions → Build Android APK → Run workflow
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==1.1.2"

      - name: Build APK (arm64)
        run: |
          flet build apk --yes --arch arm64-v8a \
            --build-version 1.0.0 \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --exclude tests --exclude "*.log" --exclude assets/fonts \
            --log-format github

      - uses: actions/upload-artifact@v4
        with:
          name: unit-convert-apk
          path: build/apk/*.apk
          if-no-files-found: error
