name: Build Flet APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build APK with Flet official action
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"

      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unit-convert-apk
          path: "*.apk"
