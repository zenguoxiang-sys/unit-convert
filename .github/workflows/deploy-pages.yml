name: Deploy PWA to GitHub Pages

# 每次 push 到 main，自动构建 Web 版并发布到 GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==1.1.2"

      - name: Build web
        run: |
          flet build web --yes --no-cdn \
            --base-url "/${{ github.event.repository.name }}/" \
            --pwa-short-name "单位换算" \
            --pwa-theme-color "#1565c0" \
            --pwa-background-color "#0b4f8a" \
            --build-version 1.0.0 \
            --build-number "${GITHUB_RUN_NUMBER}"

      - name: Patch iOS meta tags
        run: python3 patch_web.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
